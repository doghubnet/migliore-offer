<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800" role="img" aria-label="Book cover placeholder">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#2a66ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1800" fill="url(#bg)"/>
  <rect x="80" y="80" width="1040" height="1640" rx="28" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.4)"/>
  <text x="600" y="760" text-anchor="middle" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="88" font-weight="700">BOOK TITLE</text>
  <text x="600" y="860" text-anchor="middle" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="42">Replace with final cover image</text>
</svg>
